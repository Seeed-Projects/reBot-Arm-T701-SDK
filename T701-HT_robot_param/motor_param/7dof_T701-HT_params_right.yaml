robot:
  name: "T701-HT"
  robot_name: "T701-HT"
  Serial_Type: "/dev/ttyACM"
  Seial_baudrate: 4000000
  # 电机命令超时，单位 ms，范围 0–32760。超时后进入阻尼模式，0 表示禁用。
  # Motor command timeout in ms (0–32760). The motor enters damping mode on timeout. Zero disables it.
  motor_timeout_ms: 0
  # 输出 CAN 端口错误信息，便于排查问题。
  # Report CAN port errors for troubleshooting.
  canport_error_output_flag: false
  # 启用通信板的特殊配置。
  # Enable the special communication board configuration.
  board_special_flag: false
  # 电机退出时的刹车选项，含义由底层 SDK 定义。
  # Motor braking option on exit, as defined by the native SDK.
  exit_motor_brake_flag: true
  CANboard_num: 1
  CANboard:
    No_1_CANboard:
      CANport_num: 1
      CANport:
        CANport_1:
          serial_id: 2
          motor_num: 8
          motor:
